<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#24403a">
<meta name="description" content="冉淳旭 · 上海理工大学 电子信息大类 · AI 技能认证 ×9 · 个人简历">
<title>冉淳旭 · 个人简历</title>
<style>
  /* ============ 设计基调：米白纸张 + 深墨蓝 + 金色点缀 ============ */
  :root{
    --paper:#e9e2cf; --surface:#f6f0e1;
    --ink:#2b2820; --muted:#7b715e; --line:#d3c6a6;
    --navy:#24403a; --gold:#a97f2c; --gold-2:#c9a75a;
    --shadow:0 1px 0 rgba(30,24,10,.05);
    --shadow-lg:0 18px 44px rgba(40,30,12,.16);
    --radius:14px; --nav-h:66px;
    --serif:Georgia,"Times New Roman","Noto Serif SC","Songti SC","SimSun",serif;
    --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#161209; --surface:#201a10; --ink:#e7dec8; --muted:#a3957a; --line:#40361f;
      --navy:#5e7d6e; --gold:#d2b256; --gold-2:#e6cf8b;
      --shadow:0 1px 0 rgba(255,255,255,.02);
      --shadow-lg:0 18px 44px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:var(--sans); color:var(--ink); line-height:1.7;
    -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
    letter-spacing:.01em;
    background:
      radial-gradient(rgba(43,40,32,.035) 1px, transparent 1.6px) 0 0 / 24px 24px,
      var(--paper);
  }
  ::selection{background:var(--navy); color:#fff}
  a{color:var(--navy); text-decoration:none}
  img{max-width:100%; display:block}

  /* ---------- 顶部导航 ---------- */
  #navbar{
    position:fixed; inset:0 0 auto 0; height:var(--nav-h); z-index:100;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:0 6vw;
    background:color-mix(in srgb, var(--paper) 84%, transparent);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .nav-brand{font-family:var(--serif); font-weight:600; font-size:1.15rem; letter-spacing:2px; color:var(--ink)}
  .nav-brand em{font-style:normal; color:var(--gold)}
  .nav-links{
    display:none; position:absolute; top:var(--nav-h); left:0; right:0; gap:2px;
    flex-direction:column;
    background:var(--surface); border-bottom:1px solid var(--line);
    padding:10px 6vw 16px; box-shadow:var(--shadow-lg);
  }
  .nav-links.open{display:flex}
  .nav-links a{
    padding:13px 14px; border-radius:8px; color:var(--muted); font-size:1rem; letter-spacing:.5px;
    transition:color .18s, background .18s;
  }
  .nav-links a:hover{color:var(--navy); background:color-mix(in srgb, var(--navy) 6%, transparent)}
  .nav-links a.active{color:var(--navy); font-weight:600}
  .nav-actions{display:flex; gap:8px; align-items:center}
  .icon-btn{
    width:42px; height:42px; border-radius:50%; border:1px solid var(--line);
    background:transparent; color:var(--ink); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:border-color .18s, transform .18s, background .18s;
  }
  .icon-btn:hover{transform:translateY(-2px); border-color:var(--navy); background:var(--surface)}
  .menu-btn{display:flex}

  /* ---------- 主体 ---------- */
  main{max-width:960px; margin:0 auto; padding:calc(var(--nav-h) + 40px) 22px 0}
  section{scroll-margin-top:calc(var(--nav-h) + 16px); margin-bottom:64px}
  .sec-title{font-family:var(--serif); font-size:1.45rem; font-weight:600; letter-spacing:1px; margin-bottom:8px; display:flex; align-items:baseline; gap:12px}
  .sec-title .idx{font-family:var(--sans); font-size:.82rem; letter-spacing:1px; color:var(--gold); font-weight:600}
  .sec-rule{height:1px; background:linear-gradient(90deg,var(--gold),transparent); margin:2px 0 26px; border:none}
  .sec-sub{color:var(--muted); font-size:.93rem; margin-bottom:24px}

  /* ---------- Hero ---------- */
  #hero{
    position:relative; overflow:hidden;
    border-radius:16px; padding:50px clamp(22px,5vw,48px);
    background:
      radial-gradient(480px 280px at 92% -5%, rgba(201,167,90,.22), transparent 62%),
      linear-gradient(150deg,#1a2d26 0%,#24403a 58%,#2b4b41 100%);
    color:#efe6cf; box-shadow:var(--shadow-lg);
  }
  .hero-kicker{font-size:.78rem; letter-spacing:4px; color:var(--gold-2); text-transform:uppercase; margin-bottom:14px}
  .hero-name{font-family:var(--serif); font-size:clamp(2.1rem,6.5vw,2.8rem); font-weight:600; letter-spacing:4px; color:#f3ecd6}
  .hero-rule{width:60px; height:3px; background:linear-gradient(90deg,var(--gold-2),rgba(201,167,90,.08)); border:none; margin:20px 0 18px}
  .hero-title{font-size:1.02rem; color:rgba(243,236,214,.92); font-weight:600; letter-spacing:.5px; margin-bottom:14px}
  .hero-intro{max-width:660px; color:rgba(240,231,208,.82); font-size:.97rem; margin-bottom:22px}
  .hero-badges{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:24px}
  .badge{
    padding:5px 14px; border-radius:999px; font-size:.8rem; letter-spacing:.5px;
    color:rgba(243,236,214,.9); border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.07);
  }
  .hero-actions{display:flex; flex-wrap:wrap; gap:10px}
  .btn{
    display:inline-flex; align-items:center; gap:8px; min-height:44px;
    padding:12px 22px; border-radius:10px; border:1px solid transparent; cursor:pointer;
    font-size:.9rem; font-weight:600; letter-spacing:.5px; font-family:var(--sans);
    transition:transform .18s, box-shadow .18s, background .18s, color .18s;
  }
  .btn:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg)}
  .btn-primary{background:var(--gold); color:#fff}
  .btn-primary:hover{background:color-mix(in srgb, var(--gold) 86%, #000); box-shadow:0 12px 26px rgba(0,0,0,.28)}
  .btn-ghost{background:rgba(255,255,255,.08); color:#f0e6cf; border-color:rgba(255,255,255,.3)}
  .btn-ghost:hover{border-color:var(--gold-2); color:var(--gold-2)}

  /* ---------- 亮点 ---------- */
  .hl-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px}
  .hl-card{
    background:var(--surface); border:1px solid var(--line); border-top:2px solid var(--gold);
    border-radius:var(--radius); padding:24px 20px; text-align:center;
    transition:transform .2s, box-shadow .2s;
  }
  .hl-card:hover{transform:translateY(-4px); box-shadow:var(--shadow-lg)}
  .hl-num{font-family:var(--serif); font-size:1.9rem; font-weight:600; color:var(--ink); line-height:1.15}
  .hl-unit{font-family:var(--sans); font-size:.95rem; font-weight:600; color:var(--gold)}
  .hl-label{margin-top:8px; color:var(--muted); font-size:.85rem; letter-spacing:.3px}

  /* ---------- 卡片 ---------- */
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:24px 26px; margin-bottom:16px; transition:transform .2s, box-shadow .2s;
  }
  .card:hover{transform:translateY(-3px); box-shadow:var(--shadow-lg)}
  .card-head{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:6px; margin-bottom:3px}
  .card-role{font-weight:700; font-size:1.05rem; letter-spacing:.3px}
  .card-company{color:var(--navy); font-weight:600; font-size:.92rem}
  .card-time{color:var(--muted); font-size:.83rem; white-space:nowrap; letter-spacing:.3px}
  .card ul{margin-top:10px; padding-left:0; list-style:none}
  .card li{margin-bottom:8px; padding-left:20px; position:relative; color:var(--ink); font-size:.94rem}
  .card li::before{content:""; position:absolute; left:2px; top:.62em; width:7px; height:1.5px; background:var(--gold)}

  /* ---------- Tabs ---------- */
  .tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:20px}
  [role="tab"]{
    padding:9px 20px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface); color:var(--muted); cursor:pointer; font-size:.88rem; font-weight:600; letter-spacing:.5px;
    transition:all .18s;
  }
  [role="tab"]:hover{color:var(--navy); border-color:var(--navy)}
  [role="tab"][aria-selected="true"]{background:var(--navy); color:#fff; border-color:var(--navy)}
  .tab-panel[hidden]{display:none}

  /* ---------- 技能 ---------- */
  .skill-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:18px}
  .skill-group{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:22px}
  .skill-group h3{font-size:.86rem; color:var(--gold); letter-spacing:2px; margin-bottom:16px; font-weight:600}
  .skill-item{margin-bottom:14px}
  .skill-top{display:flex; justify-content:space-between; font-size:.88rem; margin-bottom:6px}
  .skill-name{font-weight:600; letter-spacing:.3px}
  .skill-note{color:var(--muted); font-size:.8rem}
  .bar{height:3px; border-radius:999px; background:var(--line); overflow:hidden}
  .bar i{display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,var(--navy),var(--gold)); width:0; transition:width .9s cubic-bezier(.22,.61,.36,1)}

  /* ---------- 证书 ---------- */
  .cert-entry{display:flex; flex-wrap:wrap; gap:16px; align-items:center}
  .cert-logo{
    width:44px; height:44px; border-radius:12px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; color:var(--navy);
    font-family:var(--serif); font-weight:700; font-size:.95rem;
    background:color-mix(in srgb, var(--navy) 8%, transparent); border:1px solid var(--line);
  }
  .cert-info{flex:1; min-width:180px}
  .cert-title{font-weight:700; letter-spacing:.3px}
  .cert-note{color:var(--muted); font-size:.83rem}
  .cert-count{font-family:var(--serif); font-size:1.25rem; font-weight:600; color:var(--gold); white-space:nowrap}
  .gallery{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-top:22px}
  .gallery figure{
    background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden; cursor:zoom-in;
    transition:transform .2s, box-shadow .2s; margin:0;
  }
  .gallery figure:hover{transform:translateY(-4px) scale(1.01); box-shadow:var(--shadow-lg)}
  .gallery img{width:100%; aspect-ratio:3/2.1; object-fit:cover}
  .gallery figcaption{padding:8px 12px; font-size:.78rem; color:var(--muted); letter-spacing:.3px}

  /* ---------- 教育 ---------- */
  .edu-item{display:flex; gap:18px}
  .edu-dot{width:9px; height:9px; border-radius:50%; background:var(--gold); margin-top:9px; flex-shrink:0; box-shadow:0 0 0 4px color-mix(in srgb, var(--gold) 16%, transparent)}

  /* ---------- 页脚 ---------- */
  footer{border-top:1px solid var(--line); text-align:center; padding:32px 20px 48px; color:var(--muted); font-size:.84rem; background:var(--surface)}
  footer .f-up{color:var(--gold); font-size:.78rem; letter-spacing:1px; margin-top:4px}
  .f-qr{margin-top:20px; display:flex; flex-direction:column; align-items:center; gap:8px}
  .f-qr img{width:120px; height:120px; border-radius:10px; border:1px solid var(--line); box-shadow:var(--shadow)}
  .f-qr-tip{font-size:.76rem; letter-spacing:2px; color:var(--gold)}

  /* ---------- 返回顶部 ---------- */
  #backTop{
    position:fixed; right:16px; bottom:16px; z-index:90;
    width:52px; height:52px; border-radius:50%; border:none; cursor:pointer;
    background:var(--navy); color:#fff;
    display:flex; align-items:center; justify-content:center;
    opacity:0; visibility:hidden; transform:translateY(12px);
    transition:opacity .2s, transform .2s, visibility .2s; box-shadow:var(--shadow-lg);
  }
  #backTop.show{opacity:1; visibility:visible; transform:none}

  /* ---------- 灯箱 ---------- */
  #lightbox{
    position:fixed; inset:0; z-index:200; background:rgba(6,10,18,.88);
    display:flex; align-items:center; justify-content:center; padding:24px;
    opacity:0; visibility:hidden; transition:opacity .22s;
  }
  #lightbox.show{opacity:1; visibility:visible}
  #lightbox img{max-width:92vw; max-height:88vh; border-radius:10px; box-shadow:0 30px 80px rgba(0,0,0,.5); background:#fff}
  #lightbox .lb-caption{position:absolute; bottom:20px; left:50%; transform:translateX(-50%); color:#cbd5e1; font-size:.88rem; background:rgba(0,0,0,.5); padding:6px 16px; border-radius:999px}

  /* ---------- Toast ---------- */
  #toast{
    position:fixed; left:50%; bottom:34px; transform:translateX(-50%) translateY(20px);
    background:#111827; color:#fff; padding:10px 22px; border-radius:999px; font-size:.86rem;
    opacity:0; visibility:hidden; transition:all .25s; z-index:300; box-shadow:0 10px 30px rgba(0,0,0,.3);
  }
  #toast.show{opacity:1; visibility:visible; transform:translateX(-50%) translateY(0)}

  /* ---------- 进入动画 ---------- */
  .fade{opacity:0; transform:translateY(16px); transition:opacity .5s ease, transform .5s ease}
  .fade.in{opacity:1; transform:none}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important}
    html{scroll-behavior:auto}
    .fade{opacity:1; transform:none}
  }

  /* ---------- 桌面端增强 ---------- */
  @media (min-width:821px){
    .menu-btn{display:none}
    .nav-links{
      display:flex; position:static; flex-direction:row; align-items:center; gap:4px;
      padding:0; background:transparent; border:none; box-shadow:none;
    }
    .nav-links a{padding:8px 14px; font-size:.92rem}
    #backTop{width:46px; height:46px; right:24px; bottom:24px}
  }

  /* ---------- 打印 ---------- */
  @media print{
    body{background:#fff !important}
    #navbar,#backTop,#lightbox,#toast,.nav-actions,.icon-btn{display:none !important}
    main{padding:0 !important; max-width:100%}
    section{margin-bottom:20px; break-inside:avoid}
    .card,.skill-group,.hl-card,.gallery figure{box-shadow:none !important; border-color:#d8d5cc !important; background:#fff !important}
    #hero{border-bottom-color:#d8d5cc; padding-top:10px}
    .fade{opacity:1 !important; transform:none !important}
    .gallery img{aspect-ratio:auto; max-height:150px; object-fit:contain; background:#f3f4f6}
    a{color:inherit}
    .bar i{width:100% !important}
  }
</style>
</head>
<body>

<nav id="navbar" aria-label="主导航">
  <a class="nav-brand" href="#hero">冉淳<em>旭</em></a>
  <div class="nav-links" id="navLinks"></div>
  <div class="nav-actions">
    <button class="icon-btn menu-btn" id="menuBtn" title="菜单" aria-label="打开菜单" aria-expanded="false" aria-controls="navLinks">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>
    <button class="icon-btn" id="themeBtn" title="切换深浅色" aria-label="切换深浅色"></button>
    <button class="icon-btn" id="printBtn" title="打印 / 导出 PDF" aria-label="打印">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
    </button>
  </div>
</nav>

<main>
  <!-- Hero -->
  <section id="hero">
    <div class="hero-kicker">PERSONAL RESUME · 2026</div>
    <h1 class="hero-name" id="heroName"></h1>
    <hr class="hero-rule">
    <div class="hero-title" id="heroTitle"></div>
    <p class="hero-intro" id="heroIntro"></p>
    <div class="hero-badges" id="heroBadges"></div>
    <div class="hero-actions" id="heroActions"></div>
  </section>

  <!-- 亮点 -->
  <section id="highlights">
    <h2 class="sec-title"><span class="idx">01</span>核心亮点</h2>
    <hr class="sec-rule">
    <p class="sec-sub">一屏快速了解关键信息</p>
    <div class="hl-grid" id="hlGrid"></div>
  </section>

  <!-- 经历 -->
  <section id="experience">
    <h2 class="sec-title"><span class="idx">02</span>经历</h2>
    <hr class="sec-rule">
    <p class="sec-sub">社会实践 · 从行动到结果</p>
    <div id="expTabs" class="tabs" role="tablist" aria-label="经历分类"></div>
    <div id="expPanels"></div>
  </section>

  <!-- 项目 -->
  <section id="projects" hidden>
    <h2 class="sec-title"><span class="idx">03</span>项目</h2>
    <hr class="sec-rule">
    <div id="projectGrid"></div>
  </section>

  <!-- 技能 -->
  <section id="skills">
    <h2 class="sec-title"><span class="idx">04</span>技能</h2>
    <hr class="sec-rule">
    <p class="sec-sub">熟练度为自我评估，持续成长中</p>
    <div class="skill-grid" id="skillGrid"></div>
  </section>

  <!-- 教育 -->
  <section id="education">
    <h2 class="sec-title"><span class="idx">05</span>教育背景</h2>
    <hr class="sec-rule">
    <div id="eduList"></div>
  </section>

  <!-- 证书 -->
  <section id="certificates">
    <h2 class="sec-title"><span class="idx">06</span>获奖与证书</h2>
    <hr class="sec-rule">

      { name: "AI 内容创作", level: 70, note: "提示词与产出物打磨" }

      { name: "剪映视频剪辑", level: 60, note: "剪辑与字幕" }
    ]},
    { group: "软技能", items: [
      { name: "沟通表达", level: 85, note: "家教授课经验验证" },
      { name: "耐心与责任心", level: 90, note: "一对一辅导全流程负责" }

  ],
  education: [{

/* ============================================================
   工具函数
   ============================================================ */
const $ = s => document.querySelector(s);
const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
const toast = msg => { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1800); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ============================================================
   渲染
   ============================================================ */
function renderNav(){
  const links = [
    { id: "highlights", label: "亮点" },
    { id: "experience", label: "经历" },
    { id: "skills", label: "技能" },
    { id: "education", label: "教育" },
    { id: "certificates", label: "证书" }
  ];
  const box = $("#navLinks");
  box.innerHTML = "";
  links.forEach(l => {
    const a = el("a", null, esc(l.label));
    a.href = "#" + l.id;
    a.dataset.target = l.id;
    box.appendChild(a);
  });
  const secs = [...document.querySelectorAll("main section[id]")];
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting){
        box.querySelectorAll("a").forEach(a => a.classList.toggle("active", a.dataset.target === e.target.id));
      }
    });
  }, { rootMargin: "-45% 0px -50% 0px" });
  secs.forEach(s => io.observe(s));
}

function renderHero(){
  $("#heroName").textContent = resume.name;
  $("#heroTitle").textContent = resume.title;
  $("#heroIntro").textContent = resume.intro;
  const badgeBox = $("#heroBadges");
  badgeBox.innerHTML = "";
  resume.badges.forEach(b => badgeBox.appendChild(el("span", "badge", esc(b))));
  const act = $("#heroActions");
  act.innerHTML = "";
  const tel = el("button", "btn btn-ghost", "<svg width='15' height='15' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.5' style='vertical-align:-2px'><path d='M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z'/></svg> 电话");
  tel.addEventListener("click", () => { location.href = "tel:" + resume.contact.phone; });
  const email = el("button", "btn btn-ghost", "<svg width='15' height='15' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.5' style='vertical-align:-2px'><rect x='2' y='4' width='20' height='16' rx='2'/><path d='m22 7-10 6L2 7'/></svg> 复制邮箱");
  email.addEventListener("click", copyEmail);
  const print = el("button", "btn btn-primary", "<svg width='15' height='15' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.5' style='vertical-align:-2px'><polyline points='6 9 6 2 18 2 18 9'/><path d='M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2'/><rect x='6' y='14' width='12' height='8'/></svg> 导出 PDF");
  print.addEventListener("click", () => window.print());
  act.append(tel, email, print);
}

function renderHighlights(){
  const grid = $("#hlGrid");
  resume.highlights.forEach(h => {
    const c = el("div", "hl-card");
    c.appendChild(el("div", "hl-num", esc(h.num) + "<span class='hl-unit'>" + esc(h.unit) + "</span>"));
    c.appendChild(el("div", "hl-label", esc(h.label)));
    grid.appendChild(c);
  });
}

function renderExperience(){
  const cats = resume.experience.categories;
  if (!cats.length) return;
  const tabBox = $("#expTabs");
  const panelBox = $("#expPanels");
  let active = 0;
  cats.forEach((cat, i) => {
    const btn = el("button", null, esc(cat));
    btn.setAttribute("role", "tab");
    btn.id = "tab-" + i;
    btn.setAttribute("aria-controls", "panel-" + i);
    btn.setAttribute("aria-selected", String(i === active));
    btn.tabIndex = i === active ? 0 : -1;
    btn.addEventListener("click", () => setActive(i));
    tabBox.appendChild(btn);
  });
  tabBox.setAttribute("aria-orientation", "horizontal");
  tabBox.addEventListener("keydown", e => {
    const keys = ["ArrowRight", "ArrowLeft"];
    if (!keys.includes(e.key)) return;
    const dir = e.key === "ArrowRight" ? 1 : -1;
    const next = (active + dir + cats.length) % cats.length;
    setActive(next);
    tabBox.querySelectorAll("[role=tab]")[next].focus();
  });
  function setActive(i){
    active = i;
    tabBox.querySelectorAll("[role=tab]").forEach((t, j) => {
      t.setAttribute("aria-selected", String(j === i));
      t.tabIndex = j === i ? 0 : -1;
    });
    renderPanel(i);
  }
  function renderPanel(i){
    panelBox.innerHTML = "";
    const cat = cats[i];
    const items = resume.experience.items[cat] || [];
    const box = el("div", "tab-panel");
    box.id = "panel-" + i;
    box.setAttribute("role", "tabpanel");
    box.setAttribute("aria-labelledby", "tab-" + i);
    items.forEach(it => box.appendChild(expCard(it)));
    panelBox.appendChild(box);
  }
  setActive(0);
}
function expCard(it){
  const card = el("article", "card");
  const head = el("div", "card-head");
  head.appendChild(el("span", "card-role", esc(it.role)));
  head.appendChild(el("span", "card-time", esc(it.time)));
  const co = el("div", "card-company", esc(it.company));
  card.appendChild(head);
  card.appendChild(co);
  const ul = el("ul");
  it.points.forEach(p => ul.appendChild(el("li", null, esc(p))));
  card.appendChild(ul);
  return card;
}

function renderProjects(){
  if (!resume.projects || !resume.projects.length){ $("#projects").hidden = true; return; }
  const grid = $("#projectGrid");
  resume.projects.forEach(p => {
    const card = el("article", "card");
    const head = el("div", "card-head");
    head.appendChild(el("span", "card-role", esc(p.name)));
    if (p.link) head.appendChild(el("a", "card-time", "链接 →")).setAttribute("href", p.link);
    card.appendChild(head);
    if (p.tech) card.appendChild(el("div", "card-company", esc(p.tech)));
    const ul = el("ul");
    p.points.forEach(x => ul.appendChild(el("li", null, esc(x))));
    card.appendChild(ul);
    grid.appendChild(card);
  });
}

function renderSkills(){
  const grid = $("#skillGrid");
  resume.skills.forEach(g => {
    const box = el("div", "skill-group");
    box.appendChild(el("h3", null, esc(g.group)));
    g.items.forEach(it => {
      const item = el("div", "skill-item");
      const top = el("div", "skill-top");
      top.appendChild(el("span", "skill-name", esc(it.name)));
      top.appendChild(el("span", "skill-note", esc(it.note || it.level + "%")));
      const bar = el("div", "bar");
      const fill = el("i");
      bar.appendChild(fill);
      item.appendChild(top);
      item.appendChild(bar);
      box.appendChild(item);
      bar._fill = fill;
      bar._level = it.level;
    });
    grid.appendChild(box);
  });
}

function renderEducation(){
  const box = $("#eduList");
  resume.education.forEach(e => {
    const card = el("article", "card edu-item");
    const dot = el("span", "edu-dot");
    const body = el("div");
    body.style.flex = "1";
    const head = el("div", "card-head");
    head.appendChild(el("span", "card-role", esc(e.school)));
    head.appendChild(el("span", "card-time", esc(e.time)));
    body.appendChild(head);
    body.appendChild(el("div", "card-company", esc(e.major) + " · " + esc(e.degree)));
    const ul = el("ul");
    e.points.forEach(p => ul.appendChild(el("li", null, esc(p))));
    body.appendChild(ul);
    card.appendChild(dot);
    card.appendChild(body);
    box.appendChild(card);
  });
}

function renderCertificates(){
  const list = $("#certList");
  resume.certificates.forEach(c => {
    const card = el("article", "card cert-entry");
    const logo = el("span", "cert-logo", esc(c.vendor.charAt(0)));
    const info = el("div", "cert-info");
    info.appendChild(el("div", "cert-title", esc(c.vendor) + " · " + esc(c.title)));
    info.appendChild(el("div", "cert-note", "AI 技能认证 · 2026 年"));
    card.appendChild(logo);
    card.appendChild(info);
    card.appendChild(el("span", "cert-count", esc(c.count)));
    list.appendChild(card);
  });
  const gallery = $("#certGallery");
  const figs = gallery.querySelectorAll("figure");
  if (figs.length){
    figs.forEach((fig, idx) => {
      const im = fig.querySelector("img");
      fig.addEventListener("click", () => openLightbox(im.src, im.alt || ("AI 技能认证证书 " + (idx + 1))));
    });
  } else {
    gallery.innerHTML = "<p style='color:var(--muted)'>证书图片整理中，稍后补充。</p>";
  }
}

function openLightbox(src, caption){
  $("#lbImg").src = src;
  $("#lbCaption").textContent = caption;
  $("#lightbox").classList.add("show");
}
function closeLightbox(){ $("#lightbox").classList.remove("show"); }

function copyEmail(){
  const addr = resume.contact.emailLocal + "@" + resume.contact.emailDomain;
  const done = () => toast("邮箱已复制：" + addr);
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(addr).then(done).catch(() => fallbackCopy(addr, done));
  } else fallbackCopy(addr, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch(e){ prompt("请手动复制邮箱：", text); }
  document.body.removeChild(ta);
}

function applyTheme(dark){
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  $("#themeBtn").innerHTML = dark
    ? "<svg width='17' height='17' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.5' stroke-linecap='round'><circle cx='12' cy='12' r='5'/><line x1='12' y1='1' x2='12' y2='3'/><line x1='12' y1='21' x2='12' y2='23'/><line x1='4.22' y1='4.22' x2='5.64' y2='5.64'/><line x1='18.36' y1='18.36' x2='19.78' y2='19.78'/><line x1='1' y1='12' x2='3' y2='12'/><line x1='21' y1='12' x2='23' y2='12'/><line x1='4.22' y1='19.78' x2='5.64' y2='18.36'/><line x1='18.36' y1='5.64' x2='19.78' y2='4.22'/></svg>"
    : "<svg width='17' height='17' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><path d='M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z'/></svg>";
  $("#themeBtn").setAttribute("aria-label", dark ? "切换为浅色" : "切换为深色");
}
function initTheme(){
  const saved = localStorage.getItem("resume-theme");
  const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  applyTheme(saved ? saved === "dark" : prefersDark);
}
$("#themeBtn").addEventListener("click", () => {
  const dark = document.documentElement.getAttribute("data-theme") !== "dark";
  applyTheme(dark);
  try { localStorage.setItem("resume-theme", dark ? "dark" : "light"); } catch(e){}
});

window.addEventListener("scroll", () => {
  $("#backTop").classList.toggle("show", window.scrollY > 420);
}, { passive: true });
$("#backTop").addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
$("#printBtn").addEventListener("click", () => window.print());

(function(){
  const btn = $("#menuBtn"), box = $("#navLinks");
  btn.addEventListener("click", e => {
    e.stopPropagation();
    const open = box.classList.toggle("open");
    btn.setAttribute("aria-expanded", String(open));
  });
  box.addEventListener("click", e => {
    if (e.target.closest("a")) { box.classList.remove("open"); btn.setAttribute("aria-expanded", "false"); }
  });
  document.addEventListener("click", e => {
    if (!e.target.closest("#navbar")) { box.classList.remove("open"); btn.setAttribute("aria-expanded", "false"); }
  });
})();

$("#lightbox").addEventListener("click", closeLightbox);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeLightbox(); });

function initAnimations(){
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce){ document.querySelectorAll(".bar i").forEach(f => { f.style.width = f.parentElement._level + "%"; }); return; }
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      e.target.classList.add("in");
      e.target.querySelectorAll(".bar i").forEach(f => { f.style.width = f.parentElement._level + "%"; });
      io.unobserve(e.target);
    });
  }, { threshold: 0.12 });
  document.querySelectorAll(".fade").forEach(n => io.observe(n));
}

function renderFooter(){
  $("#footerCopy").textContent = resume.footer.copyright;
  $("#footerTime").textContent = resume.footer.updated;
}

/* ============================================================
   启动
   ============================================================ */
renderNav();
renderHero();
renderHighlights();
renderExperience();
renderProjects();
renderSkills();
renderEducation();
renderCertificates();
renderFooter();
initTheme();
initAnimations();
</script>

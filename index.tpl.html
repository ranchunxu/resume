<style>
  :root{
    --primary:#2563eb; --primary-2:#4f46e5; --accent:#0d9488;
    --bg:#f4f6fb; --surface:#ffffff; --surface-2:#f8fafc;
    --text:#1a2233; --muted:#5b6b85; --border:#e3e8f0;
    --shadow:0 10px 30px rgba(30,41,80,.08);
    --shadow-lg:0 18px 44px rgba(30,41,80,.14);
    --radius:16px; --nav-h:64px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --primary:#60a5fa; --primary-2:#818cf8; --accent:#2dd4bf;
      --bg:#0b1220; --surface:#131c2e; --surface-2:#0e1626;
      --text:#e6ecf7; --muted:#93a1bb; --border:#24304a;
      --shadow:0 10px 30px rgba(0,0,0,.4);
      --shadow-lg:0 18px 44px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--primary); color:#fff}
  a{color:var(--primary); text-decoration:none}
  img{max-width:100%; display:block}

  /* ---------- 顶部导航 ---------- */
  #navbar{
    position:fixed; inset:0 0 auto 0; height:var(--nav-h); z-index:100;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:0 6vw;
    background:color-mix(in srgb, var(--surface) 82%, transparent);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
  }
  .nav-brand{font-weight:800; font-size:1.15rem; letter-spacing:.5px; color:var(--text)}
  .nav-brand b{color:var(--primary)}
  .nav-links{display:flex; gap:4px; align-items:center}
  .nav-links a{
    padding:8px 14px; border-radius:10px; color:var(--muted); font-size:.92rem;
    transition:color .18s, background .18s;
  }
  .nav-links a:hover{color:var(--primary); background:var(--surface-2)}
  .nav-links a.active{color:var(--primary); background:color-mix(in srgb, var(--primary) 12%, transparent); font-weight:600}
  .nav-actions{display:flex; gap:8px; align-items:center}
  .icon-btn{
    width:38px; height:38px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface); color:var(--text); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:transform .18s, box-shadow .18s, border-color .18s;
  }
  .icon-btn:hover{transform:translateY(-2px); box-shadow:var(--shadow); border-color:var(--primary)}

  /* ---------- 主体容器 ---------- */
  main{max-width:1100px; margin:0 auto; padding:calc(var(--nav-h) + 24px) 20px 0}
  section{scroll-margin-top:calc(var(--nav-h) + 16px); margin-bottom:56px}
  .sec-title{font-size:1.5rem; font-weight:800; margin-bottom:6px; display:flex; align-items:center; gap:10px}
  .sec-title::before{content:""; width:8px; height:24px; border-radius:4px; background:linear-gradient(180deg,var(--primary),var(--accent))}
  .sec-sub{color:var(--muted); font-size:.95rem; margin-bottom:22px}

  /* ---------- Hero ---------- */
  #hero{
    border-radius:calc(var(--radius) + 6px);
    padding:52px clamp(22px,5vw,56px);
    color:#fff; position:relative; overflow:hidden;
    background:linear-gradient(135deg,#1d4ed8 0%,#4f46e5 55%,#0d9488 130%);
    box-shadow:var(--shadow-lg);
  }
  #hero::before{
    content:""; position:absolute; inset:0; opacity:.28;
    background:
      radial-gradient(420px 260px at 88% 8%, rgba(255,255,255,.55), transparent 60%),
      radial-gradient(360px 240px at 8% 100%, rgba(45,212,191,.6), transparent 60%);
    pointer-events:none;
  }
  .hero-grid{position:relative; display:grid; grid-template-columns:1fr auto; gap:28px; align-items:center}
  .hero-avatar{
    width:96px; height:96px; border-radius:26px;
    background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.35);
    display:flex; align-items:center; justify-content:center;
    font-size:2.4rem; font-weight:800; color:#fff; backdrop-filter:blur(6px);
  }
  .hero-name{font-size:clamp(1.8rem,4vw,2.5rem); font-weight:800; letter-spacing:1px}
  .hero-title{margin:6px 0 14px; font-size:1.05rem; opacity:.92}
  .hero-intro{max-width:760px; font-size:.98rem; opacity:.9; margin-bottom:20px}
  .hero-badges{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px}
  .badge{
    padding:5px 12px; border-radius:999px; font-size:.82rem;
    background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.28);
    backdrop-filter:blur(4px);
  }
  .hero-actions{display:flex; flex-wrap:wrap; gap:10px}
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:10px 18px; border-radius:12px; border:none; cursor:pointer;
    font-size:.92rem; font-weight:600; transition:transform .18s, box-shadow .18s;
  }
  .btn:hover{transform:translateY(-2px); box-shadow:0 10px 22px rgba(0,0,0,.18)}
  .btn-primary{background:#fff; color:#1e40af}
  .btn-ghost{background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.35)}
  .btn-primary.dark{background:var(--primary); color:#fff}

  /* ---------- 亮点 ---------- */
  .hl-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:16px}
  .hl-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:22px 20px; text-align:center; transition:transform .2s, box-shadow .2s;
  }
  .hl-card:hover{transform:translateY(-4px); box-shadow:var(--shadow-lg)}
  .hl-num{
    font-size:2rem; font-weight:800; line-height:1.1;
    background:linear-gradient(135deg,var(--primary),var(--accent));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hl-unit{font-size:1rem; font-weight:600; color:inherit; -webkit-text-fill-color:var(--primary)}
  .hl-label{margin-top:6px; color:var(--muted); font-size:.85rem}

  /* ---------- 卡片通用 ---------- */
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:22px; margin-bottom:16px; transition:transform .2s, box-shadow .2s;
  }
  .card:hover{transform:translateY(-3px); box-shadow:var(--shadow)}
  .card-head{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:6px; margin-bottom:4px}
  .card-role{font-weight:700; font-size:1.05rem}
  .card-company{color:var(--primary); font-weight:600; font-size:.95rem}
  .card-time{color:var(--muted); font-size:.84rem; white-space:nowrap}
  .card ul{margin-top:8px; padding-left:18px}
  .card li{margin-bottom:6px; color:var(--text)}
  .card li::marker{color:var(--primary)}

  /* ---------- Tabs ---------- */
  .tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px}
  [role="tab"]{
    padding:9px 18px; border-radius:999px; border:1px solid var(--border);
    background:var(--surface); color:var(--muted); cursor:pointer; font-size:.9rem; font-weight:600;
    transition:all .18s;
  }
  [role="tab"]:hover{color:var(--primary); border-color:var(--primary)}
  [role="tab"][aria-selected="true"]{
    background:linear-gradient(135deg,var(--primary),var(--primary-2)); color:#fff; border-color:transparent;
  }
  .tab-panel[hidden]{display:none}

  /* ---------- 技能 ---------- */

  .skill-group{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px}
  .skill-group h3{font-size:.95rem; color:var(--muted); margin-bottom:14px; letter-spacing:1px; display:flex; align-items:center; gap:8px}
  .skill-group h3::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--accent)}
  .skill-item{margin-bottom:12px}
  .skill-top{display:flex; justify-content:space-between; font-size:.88rem; margin-bottom:5px}
  .skill-name{font-weight:600}
  .skill-note{color:var(--muted); font-size:.8rem}
  .bar{height:7px; border-radius:999px; background:var(--surface-2); overflow:hidden; border:1px solid var(--border)}
  .bar i{display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,var(--primary),var(--accent)); width:0; transition:width .9s cubic-bezier(.22,.61,.36,1)}

  /* ---------- 证书 ---------- */
  .cert-entry{display:flex; flex-wrap:wrap; gap:14px; align-items:center}
  .cert-logo{
    width:46px; height:46px; border-radius:14px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:.9rem;
    background:linear-gradient(135deg,var(--primary),var(--primary-2));
  }
  .cert-info{flex:1; min-width:180px}
  .cert-title{font-weight:700}
  .cert-note{color:var(--muted); font-size:.84rem}
  .cert-count{font-size:1.2rem; font-weight:800; color:var(--accent); white-space:nowrap}
  .gallery{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-top:20px}
  .gallery figure{
    background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; cursor:zoom-in;
    transition:transform .2s, box-shadow .2s; margin:0;
  }
  .gallery figure:hover{transform:translateY(-4px) scale(1.01); box-shadow:var(--shadow-lg)}
  .gallery img{width:100%; aspect-ratio:3/2.1; object-fit:cover}
  .gallery figcaption{padding:8px 12px; font-size:.8rem; color:var(--muted)}

  /* ---------- 时间线 ---------- */
  .edu-item{display:flex; gap:16px}
  .edu-dot{width:12px; height:12px; border-radius:50%; background:linear-gradient(135deg,var(--primary),var(--accent)); margin-top:7px; flex-shrink:0; box-shadow:0 0 0 4px color-mix(in srgb, var(--primary) 18%, transparent)}

  /* ---------- 页脚 ---------- */
  footer{
    border-top:1px solid var(--border); text-align:center; padding:30px 20px 46px;
    color:var(--muted); font-size:.86rem; background:var(--surface-2);
  }

  /* ---------- 返回顶部 ---------- */
  #backTop{
    position:fixed; right:24px; bottom:24px; z-index:90;
    width:46px; height:46px; border-radius:14px; border:none; cursor:pointer;
    background:linear-gradient(135deg,var(--primary),var(--primary-2)); color:#fff;
    display:flex; align-items:center; justify-content:center;
    opacity:0; visibility:hidden; transform:translateY(12px);
    transition:opacity .2s, transform .2s, visibility .2s; box-shadow:var(--shadow-lg);
  }
  #backTop.show{opacity:1; visibility:visible; transform:none}

  /* ---------- 灯箱 ---------- */
  #lightbox{
    position:fixed; inset:0; z-index:200; background:rgba(4,8,20,.86);
    display:flex; align-items:center; justify-content:center; padding:24px;
    opacity:0; visibility:hidden; transition:opacity .22s;
  }
  #lightbox.show{opacity:1; visibility:visible}
  #lightbox img{max-width:92vw; max-height:88vh; border-radius:12px; box-shadow:0 30px 80px rgba(0,0,0,.5); background:#fff}
  #lightbox .lb-caption{position:absolute; bottom:20px; left:50%; transform:translateX(-50%); color:#cbd5e1; font-size:.9rem; background:rgba(0,0,0,.5); padding:6px 14px; border-radius:999px}

  /* ---------- Toast ---------- */
  #toast{
    position:fixed; left:50%; bottom:34px; transform:translateX(-50%) translateY(20px);
    background:#111827; color:#fff; padding:10px 20px; border-radius:999px; font-size:.86rem;
    opacity:0; visibility:hidden; transition:all .25s; z-index:300; box-shadow:0 10px 30px rgba(0,0,0,.3);
  }
  #toast.show{opacity:1; visibility:visible; transform:translateX(-50%) translateY(0)}

  /* ---------- 进入动画 ---------- */
  .fade{opacity:0; transform:translateY(18px); transition:opacity .5s ease, transform .5s ease}
  .fade.in{opacity:1; transform:none}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important}
    html{scroll-behavior:auto}
    .fade{opacity:1; transform:none}
  }

  /* ---------- 响应式 ---------- */
  @media (max-width:820px){
    .nav-links{display:none}
    .hero-grid{grid-template-columns:1fr; text-align:left}
    .hero-avatar{display:none}
    main{padding-top:calc(var(--nav-h) + 16px)}
  }

  /* ---------- 打印 ---------- */
  @media print{
    body{background:#fff !important}
    #navbar,#backTop,#lightbox,#toast,.icon-btn,.nav-actions{display:none !important}
    main{padding:0 !important; max-width:100%}
    section{margin-bottom:18px; break-inside:avoid}
    .card,.skill-group,.hl-card,.gallery figure{box-shadow:none !important; border-color:#ddd !important; background:#fff !important}
    #hero{background:#1e40af !important; border-radius:0}
    .fade{opacity:1 !important; transform:none !important}
    .gallery img{aspect-ratio:auto; max-height:160px; object-fit:contain; background:#f3f4f6}
    a{color:inherit}
  }
</style>

function renderNav(){
  const links = [
    { id: "highlights", label: "亮点" },
    { id: "experience", label: "经历" },
    { id: "skills", label: "技能" },
    { id: "education", label: "教育" },
    { id: "certificates", label: "证书" }
  ];
  const box = $("#navLinks");
  box.innerHTML = "";
  links.forEach(l => {
    const a = el("a", null, esc(l.label));
    a.href = "#" + l.id;
    a.dataset.target = l.id;
    box.appendChild(a);
  });
  // 滚动高亮
  const secs = [...document.querySelectorAll("main section[id]")];
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting){
        box.querySelectorAll("a").forEach(a => a.classList.toggle("active", a.dataset.target === e.target.id));
      }
    });
  }, { rootMargin: "-45% 0px -50% 0px" });
  secs.forEach(s => io.observe(s));
}

function renderHighlights(){
  const grid = $("#hlGrid");
  resume.highlights.forEach(h => {
    const c = el("div", "hl-card");
    c.appendChild(el("div", "hl-num", esc(h.num) + "<span class='hl-unit'>" + esc(h.unit) + "</span>"));
    c.appendChild(el("div", "hl-label", esc(h.label)));
    grid.appendChild(c);
  });
}

function renderExperience(){
  const cats = resume.experience.categories;
  if (!cats.length) return;
  const tabBox = $("#expTabs");
  const panelBox = $("#expPanels");
  let active = 0;
  cats.forEach((cat, i) => {
    const btn = el("button", null, esc(cat));
    btn.setAttribute("role", "tab");
    btn.id = "tab-" + i;
    btn.setAttribute("aria-controls", "panel-" + i);
    btn.setAttribute("aria-selected", String(i === active));
    btn.tabIndex = i === active ? 0 : -1;
    btn.addEventListener("click", () => setActive(i));
    tabBox.appendChild(btn);
  });
  tabBox.setAttribute("aria-orientation", "horizontal");
  tabBox.addEventListener("keydown", e => {
    const keys = ["ArrowRight", "ArrowLeft"];
    if (!keys.includes(e.key)) return;
    const dir = e.key === "ArrowRight" ? 1 : -1;
    const next = (active + dir + cats.length) % cats.length;
    setActive(next);
    tabBox.querySelectorAll("[role=tab]")[next].focus();
  });
  function setActive(i){
    active = i;
    tabBox.querySelectorAll("[role=tab]").forEach((t, j) => {
      t.setAttribute("aria-selected", String(j === i));
      t.tabIndex = j === i ? 0 : -1;
    });
    renderPanel(i);
  }
  function renderPanel(i){
    panelBox.innerHTML = "";
    const cat = cats[i];
    const items = resume.experience.items[cat] || [];
    const box = el("div", "tab-panel");
    box.id = "panel-" + i;
    box.setAttribute("role", "tabpanel");
    box.setAttribute("aria-labelledby", "tab-" + i);
    items.forEach(it => box.appendChild(expCard(it)));
    panelBox.appendChild(box);
  }
  setActive(0);
}
function expCard(it){
  const card = el("article", "card");
  const head = el("div", "card-head");
  head.appendChild(el("span", "card-role", esc(it.role)));
  head.appendChild(el("span", "card-time", esc(it.time)));
  const co = el("div", "card-company", esc(it.company));
  card.appendChild(head);
  card.appendChild(co);
  const ul = el("ul");
  it.points.forEach(p => ul.appendChild(el("li", null, esc(p))));
  card.appendChild(ul);
  return card;
}

function renderProjects(){
  if (!resume.projects || !resume.projects.length){ $("#projects").hidden = true; return; }
  const grid = $("#projectGrid");
  resume.projects.forEach(p => {
    const card = el("article", "card");
    const head = el("div", "card-head");
    head.appendChild(el("span", "card-role", esc(p.name)));
    if (p.link) head.appendChild(el("a", "card-time", "链接 →")).setAttribute("href", p.link);
    card.appendChild(head);
    if (p.tech) card.appendChild(el("div", "card-company", esc(p.tech)));
    const ul = el("ul");
    p.points.forEach(x => ul.appendChild(el("li", null, esc(x))));
    card.appendChild(ul);
    grid.appendChild(card);
  });
}

function renderSkills(){
  const grid = $("#skillGrid");
  resume.skills.forEach(g => {
    const box = el("div", "skill-group");
    box.appendChild(el("h3", null, esc(g.group)));
    g.items.forEach(it => {
      const item = el("div", "skill-item");
      const top = el("div", "skill-top");
      top.appendChild(el("span", "skill-name", esc(it.name)));
      top.appendChild(el("span", "skill-note", esc(it.note || it.level + "%")));
      const bar = el("div", "bar");
      const fill = el("i");
      bar.appendChild(fill);
      item.appendChild(top);
      item.appendChild(bar);
      box.appendChild(item);
      bar._fill = fill;
      bar._level = it.level;
    });
    grid.appendChild(box);
  });
}

function renderEducation(){
  const box = $("#eduList");
  resume.education.forEach(e => {
    const card = el("article", "card edu-item");
    const dot = el("span", "edu-dot");
    const body = el("div");
    body.style.flex = "1";
    const head = el("div", "card-head");
    head.appendChild(el("span", "card-role", esc(e.school)));
    head.appendChild(el("span", "card-time", esc(e.time)));
    body.appendChild(head);
    body.appendChild(el("div", "card-company", esc(e.major) + " · " + esc(e.degree)));
    const ul = el("ul");
    e.points.forEach(p => ul.appendChild(el("li", null, esc(p))));
    body.appendChild(ul);
    card.appendChild(dot);
    card.appendChild(body);
    box.appendChild(card);
  });
}

function renderCertificates(){
  const list = $("#certList");
  resume.certificates.forEach(c => {
    const card = el("article", "card cert-entry");
    const logo = el("span", "cert-logo", esc(c.vendor.charAt(0)));
    const info = el("div", "cert-info");
    info.appendChild(el("div", "cert-title", esc(c.vendor) + " · " + esc(c.title)));
    info.appendChild(el("div", "cert-note", "AI 技能认证 · 2026 年"));
    card.appendChild(logo);
    card.appendChild(info);
    card.appendChild(el("span", "cert-count", esc(c.count)));
    list.appendChild(card);
  });
  // 图片画廊
  const gallery = $("#certGallery");
  if (CERT_IMAGES.length){
    CERT_IMAGES.forEach((img, idx) => {
      const fig = el("figure");
      const im = document.createElement("img");
      im.src = img.src; im.alt = "AI 技能认证证书 " + (idx + 1); im.loading = "lazy";
      fig.appendChild(im);
      fig.appendChild(el("figcaption", null, "AI 技能认证证书 " + (idx + 1)));
      fig.addEventListener("click", () => openLightbox(img.src, "AI 技能认证证书 " + (idx + 1)));
      gallery.appendChild(fig);
    });
  } else {
    gallery.innerHTML = "<p style='color:var(--muted)'>证书图片整理中，稍后补充。</p>";
  }
}

/* 灯箱 */
function openLightbox(src, caption){
  $("#lbImg").src = src;
  $("#lbCaption").textContent = caption;
  $("#lightbox").classList.add("show");
}
function closeLightbox(){ $("#lightbox").classList.remove("show"); }

/* 邮箱复制（防爬虫：拼接） */
function copyEmail(){
  const addr = resume.contact.emailLocal + "@" + resume.contact.emailDomain;
  const done = () => toast("邮箱已复制：" + addr);
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(addr).then(done).catch(() => fallbackCopy(addr, done));
  } else fallbackCopy(addr, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch(e){ prompt("请手动复制邮箱：", text); }
  document.body.removeChild(ta);
}

/* 深浅色主题 */
function applyTheme(dark){
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  $("#themeBtn").innerHTML = dark
    ? "<svg width='17' height='17' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round'><circle cx='12' cy='12' r='5'/><line x1='12' y1='1' x2='12' y2='3'/><line x1='12' y1='21' x2='12' y2='23'/><line x1='4.22' y1='4.22' x2='5.64' y2='5.64'/><line x1='18.36' y1='18.36' x2='19.78' y2='19.78'/><line x1='1' y1='12' x2='3' y2='12'/><line x1='21' y1='12' x2='23' y2='12'/><line x1='4.22' y1='19.78' x2='5.64' y2='18.36'/><line x1='18.36' y1='5.64' x2='19.78' y2='4.22'/></svg>"
    : "<svg width='17' height='17' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z'/></svg>";
  $("#themeBtn").setAttribute("aria-label", dark ? "切换为浅色" : "切换为深色");
}
function initTheme(){
  const saved = localStorage.getItem("resume-theme");
  const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  applyTheme(saved ? saved === "dark" : prefersDark);
}
$("#themeBtn") && ($("#themeBtn").addEventListener("click", () => {
  const dark = document.documentElement.getAttribute("data-theme") !== "dark";
  applyTheme(dark);
  try { localStorage.setItem("resume-theme", dark ? "dark" : "light"); } catch(e){}
}));

/* 返回顶部 */
window.addEventListener("scroll", () => {
  $("#backTop").classList.toggle("show", window.scrollY > 420);
}, { passive: true });
$("#backTop").addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
$("#printBtn").addEventListener("click", () => window.print());
$("#lightbox").addEventListener("click", closeLightbox);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeLightbox(); });

/* 进入动画 + 技能条填充 */
function initAnimations(){
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce){ document.querySelectorAll(".bar i").forEach(f => { f.style.width = f.parentElement._level + "%"; }); return; }
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      e.target.classList.add("in");
      e.target.querySelectorAll(".bar i").forEach(f => { f.style.width = f.parentElement._level + "%"; });
      io.unobserve(e.target);
    });
  }, { threshold: 0.12 });
  document.querySelectorAll(".fade").forEach(n => io.observe(n));
}

/* 页脚 */
function renderFooter(){
  $("#footerCopy").textContent = resume.footer.copyright;
  $("#footerTime").textContent = resume.footer.updated;
}

   启动

renderNav();
renderHero();
renderHighlights();
renderExperience();
renderProjects();
renderSkills();
renderEducation();
renderCertificates();
renderFooter();
initTheme();
initAnimations();
</script>
